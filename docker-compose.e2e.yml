# M3 阶段2 Task 8 e2e + #2 T7 三 service docker-compose e2e
# content-backend + IAM + ops 三 service + postgres（三 DB）+ minio + seed
# 用法：docker compose -f docker-compose.e2e.yml up -d --build
# content-backend :3001 / IAM :8083 / ops :3004 / postgres 35432 / minio 19000
# 端口避开 host 占用（host 已有 15432/25432 postgres）。
#
# Fold-11：postgres 加 init-multi-db.sql 建 agentos_iam + agentos_ops DB。
# Fold-12：seed 用 psql 直插 ops DB（content-backend 持 service token 非 user JWT 无权调绑定 API）。
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agentos_content
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
    # Fold-11：挂 init 脚本建 iam + ops DB（postgres 首次启动自动执行）
    volumes:
      - ./docker/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    ports: ["35432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos_content"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentos
      MINIO_ROOT_PASSWORD: agentos123
    ports: ["19000:9000", "19001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  seed:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos_content
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: agentos
      S3_SECRET_ACCESS_KEY: agentos123
      S3_BUCKET: agentos-content-test
      S3_REGION: us-east-1
      AUDIO_DIR: test/fixtures/audio
      MIGRATIONS_DIR: src/db/migrations
    command: ["pnpm", "exec", "tsx", "scripts/e2e-init.ts"]
    restart: "no"

  # IAM sibling：end_user 注册/登录/JWKS（port 8080 容器内，8083 host）
  iam:
    build:
      context: ../agentos-iam
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos_iam
      IAM_JWT_ISSUER: agentos-iam
      IAM_KEY_ENCRYPTION_KEY: dev-encryption-key-change-in-prod
      IAM_REGION: cn
      IAM_ADMIN_TOKEN: dev-admin-token-change-in-prod
      IAM_PORT: "8080"
      NODE_ENV: production
    ports: ["8083:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node:22-alpine 有 busybox wget；用 127.0.0.1 避 IPv6 ::1 解析致 connection refused
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/.well-known/jwks.json || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ops sibling：/api/internal/bindings lookup（Next.js port 3000 容器内，3004 host）
  ops:
    build:
      context: ../agentos-ops-platform
      dockerfile: web/Dockerfile
    # Dockerfile CMD=pnpm start；覆盖先 migrate 再 start（ops docker-compose.yml 同 pattern）
    command: ["sh", "-c", "pnpm db:migrate && pnpm start"]
    environment:
      DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos_ops
      # ops env.ts assertEnv（NODE_ENV=production 时 fail-fast）
      OPS_SESSION_SECRET: e2e-session-secret-32-bytes-minimum!!
      # ops config.ts assertConfig（prod 必需 ≥32 字节）
      OPS_LOOKUP_TOKEN: e2e-lookup-token-32-bytes-minimum!!
      OPS_IAM_WEBHOOK_TOKEN: e2e-iam-webhook-token-32-bytes!!!
      IAM_JWKS_URL: http://iam:8080
      IAM_JWT_ISSUER: agentos-iam
      IAM_JWT_AUDIENCE: content-backend
      NODE_ENV: production
      # sidecar 不参与 token-verify e2e（bindings route 不调 dispatch）；配 dummy 避免启动报错
      DISPATCH_SIDECAR_URL: http://localhost:9999
    ports: ["3004:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_healthy
    healthcheck:
      # /api/health endpoint 返 200（Next.js route 已编译）
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  content-backend:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
      iam:
        condition: service_healthy
      ops:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://agentos:agentos@postgres:5432/agentos_content
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: agentos
      S3_SECRET_ACCESS_KEY: agentos123
      S3_BUCKET: agentos-content-test
      S3_REGION: us-east-1
      # #2 token-verify env（NODE_ENV=production 在 Dockerfile 内设，assertProdEnv 强制非空）
      IAM_JWKS_URL: http://iam:8080
      IAM_JWT_ISSUER: agentos-iam
      IAM_JWT_AUDIENCE: content-backend
      OPS_LOOKUP_URL: http://ops:3000
      OPS_LOOKUP_TOKEN: e2e-lookup-token-32-bytes-minimum!!
      CAPABILITY_MODE: mock
    ports: ["3001:3001"]
